<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="50%" stop-color="#0e172a"/>
      <stop offset="100%" stop-color="#070c18"/>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>

    <linearGradient id="pulseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.2"/>
    </linearGradient>

    <linearGradient id="pillGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Animated Styles -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-8px) rotate(0.5deg); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(7px) rotate(-0.5deg); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.08); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 240; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes particleBlink {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.8; transform: scale(1.2); }
      }

      .floating-node-1 { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .floating-node-2 { animation: floatReverse 8s ease-in-out infinite; transform-origin: center; }
      .pulsing-aura { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .data-stream { stroke-dasharray: 12, 12; animation: streamFlow 12s linear infinite; }
      .data-stream-fast { stroke-dasharray: 8, 8; animation: streamFlow 6s linear infinite; }
      .particle-1 { animation: particleBlink 3s ease-in-out infinite; }
      .particle-2 { animation: particleBlink 4s ease-in-out infinite 1.5s; }
      .particle-3 { animation: particleBlink 5s ease-in-out infinite 0.7s; }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -1.2px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 500;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.5px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="18" fill="url(#bgGrad)"/>
  <rect width="1196" height="356" x="2" y="2" rx="16" fill="none" stroke="#334155" stroke-opacity="0.4" stroke-width="1.5"/>

  <!-- Background Grid Pattern -->
  <g opacity="0.08" stroke="#94a3b8" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="700" y1="0" x2="700" y2="360"/>
    <line x1="800" y1="0" x2="800" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1000" y1="0" x2="1000" y2="360"/>
    <line x1="1100" y1="0" x2="1100" y2="360"/>
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
  </g>

  <!-- Dynamic Ambient Glowing Auras (Background) -->
  <circle cx="220" cy="180" r="140" fill="#38bdf8" opacity="0.12" filter="url(#glow)" class="pulsing-aura"/>
  <circle cx="980" cy="180" r="160" fill="#818cf8" opacity="0.12" filter="url(#glow)" class="pulsing-aura"/>
  <circle cx="600" cy="80" r="100" fill="#34d399" opacity="0.08" filter="url(#glow)" class="pulsing-aura"/>

  <!-- Animated Revenue Pipeline Flow Lines (Background Layers) -->
  <g fill="none" opacity="0.35">
    <path d="M 50,70 Q 280,30 550,110 T 1150,80" stroke="#38bdf8" stroke-width="2" class="data-stream-fast"/>
    <path d="M 50,300 Q 320,330 650,260 T 1150,290" stroke="#818cf8" stroke-width="2" class="data-stream"/>
    <path d="M 100,180 C 350,120 850,240 1100,180" stroke="#34d399" stroke-width="1.5" class="data-stream"/>
  </g>

  <!-- Interactive/Decorative Dynamic Floating Pills (Midground, positioned at corners/margins) -->
  <g class="floating-node-1">
    <g transform="translate(60, 45)">
      <rect width="180" height="38" rx="19" fill="url(#pillGrad1)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="22" cy="19" r="6" fill="#38bdf8"/>
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">⚡ Realtime Metering</text>
    </g>
  </g>

  <g class="floating-node-2">
    <g transform="translate(950, 45)">
      <rect width="190" height="38" rx="19" fill="url(#pillGrad1)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="22" cy="19" r="6" fill="#818cf8"/>
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">⚖️ ASC 606 / IFRS 15</text>
    </g>
  </g>

  <g class="floating-node-2">
    <g transform="translate(70, 275)">
      <rect width="180" height="38" rx="19" fill="url(#pillGrad1)" stroke="#34d399" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="22" cy="19" r="6" fill="#34d399"/>
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">💳 Subscription Engine</text>
    </g>
  </g>

  <g class="floating-node-1">
    <g transform="translate(960, 275)">
      <rect width="180" height="38" rx="19" fill="url(#pillGrad1)" stroke="#f472b6" stroke-opacity="0.4" stroke-width="1"/>
      <circle cx="22" cy="19" r="6" fill="#f472b6"/>
      <text x="36" y="24" fill="#e2e8f0" class="badge-text">📊 Usage &amp; Invoicing</text>
    </g>
  </g>

  <!-- Animated Sparkling Data Particles -->
  <circle cx="310" cy="95" r="3" fill="#38bdf8" class="particle-1"/>
  <circle cx="890" cy="115" r="3.5" fill="#34d399" class="particle-2"/>
  <circle cx="260" cy="255" r="2.5" fill="#818cf8" class="particle-3"/>
  <circle cx="860" cy="245" r="3" fill="#f472b6" class="particle-1"/>

  <!-- Central Foreground Content (Title, Subtitle, Highlights) - Always in foreground -->
  <g id="foreground-content">
    <!-- Top Category Eyebrow Badge -->
    <g transform="translate(485, 82)">
      <rect width="230" height="28" rx="14" fill="#1e293b" fill-opacity="0.85" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
      <text x="115" y="19" text-anchor="middle" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="700" font-size="12" letter-spacing="1.2">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient Fill -->
    <text x="600" y="165" text-anchor="middle" fill="url(#brandGrad)" font-size="48" class="title-text" filter="url(#subtleGlow)">
      Awesome Revenue Management
    </text>

    <!-- Subtitle -->
    <text x="600" y="206" text-anchor="middle" fill="#f1f5f9" font-size="19" class="subtitle-text">
      The Defacto Guide to SaaS &amp; Open-Source Monetization Engines
    </text>

    <!-- Subtitle Meta Description -->
    <text x="600" y="235" text-anchor="middle" fill="#94a3b8" font-size="14.5" class="subtitle-text">
      Subscription Billing • Real-Time Usage Metering • ASC 606 &amp; IFRS 15 Revenue Recognition
    </text>
  </g>
</svg>
